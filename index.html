<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <!-- รองรับมือถือ / Safe Area -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ลงเวลาเข้างาน</title>

  <style>
    /* ================================
       RESET
    ================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      position: fixed;
      inset: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    /* ================================
       APP CONTAINER
    ================================= */
    .app-container {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
      background: #ffffff;

      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    /* ================================
       IFRAME
    ================================= */
    #appFrame {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;
      outline: none;

      overflow: hidden;

      background: #ffffff;

      opacity: 0;

      transition:
        opacity 0.45s ease;

      /* ป้องกันการเลือกกรอบ iframe */
      user-select: none;
    }

    #appFrame.loaded {
      opacity: 1;
    }

    /* ================================
       LOADING SCREEN
    ================================= */
    #loadingScreen {
      position: fixed;
      inset: 0;

      z-index: 9999;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: #ffffff;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;

      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #loadingScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ================================
       LOADING SPINNER
    ================================= */
    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #e5e7eb;
      border-top-color: #111827;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin-bottom: 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================================
       LOADING TEXT
    ================================= */
    .loading-title {
      font-size: 18px;
      font-weight: 600;

      color: #111827;

      text-align: center;
    }

    .loading-subtitle {
      margin-top: 6px;

      font-size: 13px;

      color: #6b7280;

      text-align: center;
    }

    /* ================================
       MOBILE
    ================================= */
    @media (max-width: 768px) {
      .loading-title {
        font-size: 17px;
      }

      .loading-subtitle {
        font-size: 12px;
      }

      .spinner {
        width: 38px;
        height: 38px;

        border-width: 3px;
      }
    }
  </style>
</head>

<body>

  <!-- ================================
       LOADING SCREEN
  ================================= -->
  <div id="loadingScreen">
    <div class="spinner"></div>

    <div class="loading-title">
      ลงเวลาเข้างาน
    </div>

    <div class="loading-subtitle">
      กำลังโหลดระบบ...
    </div>
  </div>


  <!-- ================================
       APP CONTAINER
  ================================= -->
  <main class="app-container">

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwGXyTTitcADYTUesYQ1XsjOR_UK1aLarv0kLJ6K5XALiy5Q27Vyw7DABrqb1nfpa5gnw/exec"
      title="ลงเวลาเข้างาน"
      allow="fullscreen"
      allowfullscreen
      loading="eager"
      scrolling="no"
      frameborder="0"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

  </main>


  <script>
    (() => {

      const iframe = document.getElementById("appFrame");
      const loadingScreen = document.getElementById("loadingScreen");

      let loaded = false;

      function hideLoading() {
        if (loaded) return;

        loaded = true;

        iframe.classList.add("loaded");

        setTimeout(() => {
          loadingScreen.classList.add("hide");
        }, 100);
      }

      /*
       * iframe โหลดเสร็จ
       */
      iframe.addEventListener("load", hideLoading);

      /*
       * Fallback กรณี Google Apps Script
       * ใช้เวลานานหรือ browser ไม่ยิง load ตามปกติ
       */
      setTimeout(() => {
        hideLoading();
      }, 15000);

    })();
  </script>

</body>
</html>
